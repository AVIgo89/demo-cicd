replicaCount: 2

image:
  repository: ghcr.io/avigo89/demo-cicd
  tag: latest
  pullPolicy: IfNotPresent

appVersion: "dev"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: demo.51.250.86.208.nip.io
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 30s
